name: Build VisionCut Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate temporary release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias visioncut \
            -storepass visioncut123 \
            -keypass visioncut123 \
            -dname "CN=VisionCut, OU=Mobile, O=VisionIT, L=Saidpur, ST=Rangpur, C=BD"

      - name: Build Release APK (arm64-v8a)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: visioncut123
          KEY_ALIAS: visioncut
          KEY_PASSWORD: visioncut123
        run: gradle assembleRelease --no-daemon

      - name: Upload VisionCut APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionCut-v1.0-arm64-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
